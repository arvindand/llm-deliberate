[project]
name = "llm-deliberate"
version = "0.1.0"
description = "Research tool for exploring multi-model deliberation and aggregation methods"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Arvind", email = "arvind@example.com" }
]
keywords = ["llm", "ai", "deliberation", "voting", "consensus", "research"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.142.2,<1",
    "uvicorn[standard]>=0.54.0,<1",
    "pydantic>=2.13.5,<3",
    "pydantic-settings>=2.15.0,<3",
    "httpx>=0.28.1,<1",
    "aiohttp>=3.14.3,<4",
    "python-dotenv>=1.2.4,<2",
    "tenacity>=9.1.4,<10",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
    "black>=26.5.1,<27",
    "ruff>=0.16.10,<1",
]

[project.scripts]
deliberate = "backend.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
dev-mode-dirs = ["."]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312", "py313"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
